<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://*.firebaseio.com https://*.firebasedatabase.app https://*.europe-west1.firebasedatabase.app; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' ws: wss: https://www.gstatic.com https://*.googleapis.com https://*.firebaseio.com https://*.firebasedatabase.app https://*.europe-west1.firebasedatabase.app wss://*.firebaseio.com wss://*.firebasedatabase.app wss://*.europe-west1.firebasedatabase.app; frame-src https://*.firebaseapp.com https://*.firebasedatabase.app https://*.europe-west1.firebasedatabase.app; object-src 'none'; base-uri 'self'">
  <title>Catapulta</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='-16 -16 32 32'><path d='M-13 9-10-6-1-13 9-10 14 0 11 10-3 12Z' fill='%236f7c8c' stroke='%2314202b' stroke-width='2.4' stroke-linejoin='round'/><path d='M-10-6-1-13 9-10 2-3Z' fill='%23a9b6c6'/></svg>">
  <meta name="theme-color" content="#0e1a24">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Barlow+Condensed:wght@600;700&family=Bungee&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Tela inicial -->
  <section id="screen-home" class="screen">
    <div class="home">
      <div class="garland" data-bulbs="26"></div>
      <header class="marquee">
        <h1 class="logo">CATAPULTA</h1>
        <p class="tagline">Funde vilas, troque queijo por pedra e <b>arremesse pedregulhos</b> nos amigos.</p>
      </header>
      <div class="cast" id="cast" aria-hidden="true"></div>
      <div class="panel join-panel">
        <label class="field">
          <span>Seu nome</span>
          <input id="in-name" maxlength="14" placeholder="Como te chamam?" autocomplete="off">
        </label>
        <button class="btn big yellow" data-act="create">Criar sala</button>
        <div class="or"><span>ou entre numa sala</span></div>
        <div class="join-row">
          <input id="in-code" maxlength="4" placeholder="CÓDIGO" autocomplete="off" aria-label="Código da sala">
          <button class="btn" data-act="join">Entrar</button>
        </div>
        <details class="key-box" id="field-key">
          <summary>Sala com chave (opcional)</summary>
          <input id="in-key" maxlength="64" placeholder="A chave vai junto no link de convite" autocomplete="off" aria-label="Chave da sala">
        </details>
        <p class="hint">2 a 4 jogadores. Bots preenchem as vagas.</p>
      </div>
    </div>
  </section>

  <!-- Sala de espera -->
  <section id="screen-lobby" class="screen hidden">
    <div class="panel lobby-card" id="lobby"></div>
  </section>

  <!-- Partida -->
  <section id="screen-game" class="screen hidden">
    <header id="players"></header>
    <main id="stage">
      <div class="garland" data-bulbs="22"></div>
      <div id="banner" role="status" aria-live="polite"></div>
      <div id="corner">
        <button class="chip-btn" data-act="mute" id="btn-mute" title="Som" aria-label="Som"></button>
        <button class="chip-btn" data-act="rules" title="Regras e custos" aria-label="Regras e custos"></button>
        <button class="chip-btn only-compact" data-act="toggle-log" id="btn-log" title="Diário e banco" aria-label="Diário e banco"></button>
      </div>
      <svg id="board" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Tabuleiro"></svg>
      <div id="sum" aria-hidden="true"></div>
      <div id="react">
        <div id="emotes"></div>
        <button class="chip-btn" data-act="toggle-react" id="btn-react" title="Reagir" aria-label="Reagir"></button>
      </div>
      <button id="dice" data-act="roll" title="Rolar os dados" aria-label="Rolar os dados">
        <span class="die" id="die-a"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
        <span class="die" id="die-b"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
      </button>
      <div id="offer"></div>
    </main>
    <aside id="side">
      <div class="side-head">
        <span class="mini-logo">CATAPULTA</span>
        <button class="room-chip" id="room-chip" title="Copiar link de convite"></button>
        <button class="chip-btn only-compact" data-act="toggle-log" aria-label="Fechar diário" id="btn-log-close"></button>
      </div>
      <div id="bank"></div>
      <div id="log"></div>
    </aside>
    <footer id="hud"></footer>
  </section>

  <div id="modal-root"></div>
  <div id="fx"></div>
  <div id="toasts" role="status" aria-live="polite"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
