<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; base-uri 'self'">
  <title>Sudoku — Quebra-Cabeça Lógico | Catapulta Online</title>
  <meta name="description" content="Preencha a grade 9x9 de números de 1 a 9 sem repetir em cada linha, coluna ou bloco 3x3. 4 níveis 100% dedutíveis com rascunho e dicas.">
  <link rel="canonical" href="https://catapulta.online/sudoku">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Catapulta Online">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:url" content="https://catapulta.online/sudoku">
  <meta property="og:title" content="Sudoku — Quebra-Cabeça Lógico">
  <meta property="og:description" content="Sudoku 9x9 na estética de Quermesse Noturna com 4 dificuldades, modo notas e dicas explicadas.">
  <meta property="og:image" content="https://catapulta.online/og.png">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='-16 -16 32 32'><rect x='-13' y='-13' width='26' height='26' rx='5' fill='%23f6e8c8' stroke='%2314202b' stroke-width='2.4'/><text y='6' text-anchor='middle' font-family='sans-serif' font-weight='900' font-size='18' fill='%23e5482f'>9</text></svg>">
  <meta name="theme-color" content="#0e1a24">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Barlow+Condensed:wght@600;700&family=Bungee&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/sudoku.css">
</head>
<body>
  <section id="screen-sudoku" class="screen sk-screen">
    <div class="ambient" data-kind="home" aria-hidden="true"></div>
    <div class="garland" data-bulbs="26"></div>

    <div class="sk-wrap">
      <!-- Topo: navegação, título e controles -->
      <header class="sk-topbar">
        <a class="btn small ghost sk-back" href="/" id="btn-back">← Mini-jogos</a>
        <div class="sk-title-group">
          <h1 class="sk-logo">SUDOKU</h1>
          <span class="sk-sub">Números na Quermesse</span>
        </div>
        <div class="sk-top-actions">
          <button class="chip-btn" data-act="mute" id="btn-mute" title="Som" aria-label="Som"></button>
          <button class="chip-btn" data-act="rules" id="btn-rules" title="Sobre, regras e créditos" aria-label="Sobre, regras e créditos"></button>
        </div>
      </header>

      <!-- Barra de nível (4 dificuldades) + cronômetro + progresso + erros + novo tabuleiro -->
      <section class="panel sk-controls" aria-label="Dificuldade e partida">
        <div class="sk-levels" role="radiogroup" aria-label="Nível de dificuldade" id="level-bar">
          <button type="button" class="seg-btn" data-act="level" data-level="easy">Fácil</button>
          <button type="button" class="seg-btn on" data-act="level" data-level="medium">Médio</button>
          <button type="button" class="seg-btn" data-act="level" data-level="hard">Difícil</button>
          <button type="button" class="seg-btn" data-act="level" data-level="expert">Mestre</button>
        </div>
        <div class="sk-meta-row">
          <div class="sk-stats">
            <span class="sk-stat" title="Tempo da partida"><b id="sk-timer">00:00</b></span>
            <span class="sk-stat" id="sk-progress" title="Casas preenchidas">0/81</span>
            <span class="sk-stat" id="sk-errors" title="Erros cometidos">Erros: <b>0</b></span>
          </div>
          <button type="button" class="btn small yellow" data-act="new-game" id="btn-new-game">Novo tabuleiro</button>
        </div>
      </section>

      <!-- Tabuleiro 9x9 + teclado numérico + ações -->
      <main class="panel sk-board-panel">
        <div class="sk-status-bar" id="sk-status" role="status" aria-live="polite">
          Toque numa casa e escolha um número de <b>1 a 9</b>.
        </div>

        <div class="sk-stage" id="sk-stage">
          <div class="sk-grid" id="sk-grid" role="grid" aria-label="Tabuleiro 9 por 9 de Sudoku"></div>
        </div>

        <!-- Teclado numérico de 1 a 9 + Apagar + Modo Notas -->
        <div class="sk-numpad" id="sk-numpad" aria-label="Teclado de números"></div>

        <div class="sk-action-bar">
          <button type="button" class="btn sk-act-btn" data-act="undo" id="btn-undo" disabled>Desfazer</button>
          <button type="button" class="btn sk-act-btn ghost" data-act="notes" id="btn-notes">Notas: OFF</button>
          <button type="button" class="btn sk-act-btn ghost" data-act="erase" id="btn-erase" disabled>Apagar</button>
          <button type="button" class="btn yellow sk-act-btn" data-act="hint" id="btn-hint">Dica</button>
        </div>
      </main>

      <div class="home-links">
        <button type="button" class="btn small ghost" data-act="rules" id="btn-bottom-rules">Como joga</button>
        <button type="button" class="btn small ghost" data-act="about" id="btn-bottom-about">Sobre e créditos</button>
      </div>
    </div>
  </section>

  <div id="modal-root"></div>
  <div id="fx"></div>
  <div id="toasts" role="status" aria-live="polite"></div>

  <script type="module" src="/sudoku/js/main.js"></script>
</body>
</html>
